<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Library</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-180.png?v=chibi1">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png?v=chibi1">
<link rel="icon" type="image/png" sizes="64x64" href="img/favicon.png?v=chibi1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1524">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Manrope:wght@400;600;700&display=swap">
<style>
/* Layout: a private two-book shelf. Lock screen, then the shelf, then one column of text per chapter. */
:root{
 --bg:#f2f0ea;--surface:#fbfaf6;--ink:#1d2333;--muted:#5f6577;--line:#d8d5cb;
 --accent:#33508f;--accent-fg:#fff;--panel:#e6eaf5;--panel-bd:#9fb0e3;--chat:#e9e7e0;
 --display:"Marcellus",Georgia,serif;--body:"Literata",Georgia,serif;--ui:"Manrope",system-ui,sans-serif;--fs:1.08rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0f1524;--surface:#161e31;--ink:#e4e6ee;--muted:#9aa2b8;--line:#28324a;--accent-fg:#0f1524;--panel:#1f2844;--panel-bd:#43538a;--chat:#1c2539;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0f1524;--surface:#161e31;--ink:#e4e6ee;--muted:#9aa2b8;--line:#28324a;--accent-fg:#0f1524;--panel:#1f2844;--panel-bd:#43538a;--chat:#1c2539;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
 padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px}
.bar .title{font-family:var(--display);font-size:1.05rem;margin-right:auto;text-decoration:none;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 72px}
.col{width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
.eyebrow{font:700 .7rem var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 .9rem var(--ui);padding:11px 18px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-fg);cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.chip{font:700 .8rem var(--ui);padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink);text-decoration:none;white-space:nowrap}

/* lock */
.lock{min-height:70vh;display:grid;place-items:center}
.lock form{width:min(100%,360px);display:flex;flex-direction:column;gap:12px;text-align:center}
.lock input{padding:12px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:1rem;text-align:center}
.lock .err{color:#c0392b;min-height:1.2em;font-size:.9rem}
.lock label{display:flex;gap:8px;justify-content:center;align-items:center;font-size:.88rem;color:var(--muted)}

/* shelf */
.book{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:18px;padding:16px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.cover{width:100%;aspect-ratio:2/3;border-radius:6px;object-fit:cover;display:block;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.cover.blank{display:grid;place-items:center;padding:12px;text-align:center;font:400 1.15rem/1.25 var(--display);color:#f4efe6;background:linear-gradient(160deg,var(--b) 0%,#1a1410 100%)}
.book .txt{display:flex;flex-direction:column;gap:8px;min-width:0}
.book h2{font-size:1.4rem;line-height:1.2}
.book p{margin:0}
.book .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
@media (max-width:480px){.book{grid-template-columns:96px minmax(0,1fr);gap:12px}.book h2{font-size:1.15rem}}

/* contents */
.search{width:100%;padding:11px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.toc{list-style:none;margin:0;padding:0}
.toc a{display:grid;grid-template-columns:3em minmax(0,1fr) auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);align-items:baseline}
.toc .n,.toc .r{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.toc a.read .t{color:var(--muted)}
.toc a.here .t{color:var(--accent);font-weight:700}
.new{font:700 .66rem var(--ui);letter-spacing:.1em;color:var(--accent);margin-left:6px}

/* reader */
.chap .cn{font:700 .72rem var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.chap h2{font-size:clamp(1.4rem,4vw,1.9rem);line-height:1.2}
.text{font-family:var(--body);font-size:var(--fs);line-height:1.75;overflow-wrap:anywhere;min-width:0}
.text p{margin:0 0 1em}
.text h3{font-size:1.2rem;margin:1.4em 0 .6em}
.text hr{border:0;margin:2em auto;width:60px;height:12px;background:radial-gradient(circle,var(--muted) 1.5px,transparent 2px) 0 50%/20px 12px repeat-x;opacity:.6}
.text blockquote.note{margin:1.5em 0;padding:10px 16px;border-left:3px solid var(--accent);background:var(--chat);border-radius:0 8px 8px 0;font-family:var(--ui);font-size:.93rem;line-height:1.55}
.text blockquote.note p{margin:.3em 0}
/* Panels: game HUD windows (same dark glass look in both themes) */
.panel{--pc:#7fa2ff;--pg:rgba(127,162,255,.35);position:relative;font-family:var(--ui);font-size:.92rem;line-height:1.55;margin:1.5em 0;padding:0 0 10px;
 color:#e8ecf8;background:linear-gradient(180deg,rgba(22,30,58,.97),rgba(12,17,36,.97));border:1px solid var(--pg);border-radius:4px;
 box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 18px var(--pg),inset 0 0 24px rgba(127,162,255,.06);font-variant-numeric:tabular-nums;overflow:hidden}
.panel::before{content:"\25C6  System";display:block;padding:6px 14px;margin-bottom:6px;font:800 .66rem var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--pc);
 background:linear-gradient(90deg,var(--pg),transparent 85%);border-bottom:1px solid var(--pg);text-shadow:0 0 8px var(--pg)}
.panel::after{content:"";position:absolute;inset:3px;pointer-events:none;
 background:linear-gradient(var(--pc),var(--pc)) top left/12px 2px,linear-gradient(var(--pc),var(--pc)) top left/2px 12px,
 linear-gradient(var(--pc),var(--pc)) top right/12px 2px,linear-gradient(var(--pc),var(--pc)) top right/2px 12px,
 linear-gradient(var(--pc),var(--pc)) bottom left/12px 2px,linear-gradient(var(--pc),var(--pc)) bottom left/2px 12px,
 linear-gradient(var(--pc),var(--pc)) bottom right/12px 2px,linear-gradient(var(--pc),var(--pc)) bottom right/2px 12px;background-repeat:no-repeat;opacity:.9}
.panel p{margin:0;padding:3px 14px}
.panel p+p{border-top:1px solid rgba(255,255,255,.06)}
.panel .lb{font-weight:800;color:var(--pc);text-transform:uppercase;font-size:.78em;letter-spacing:.08em;margin-right:4px}
.chat p{margin:0}.chat p+p{margin-top:3px}
.k-announce{--pc:#ffd36b;--pg:rgba(255,211,107,.4);text-align:center}.k-announce::before{content:"\2726  Announcement  \2726";text-align:center;background:linear-gradient(90deg,transparent,var(--pg),transparent)}
.k-announce p:first-of-type{font:400 1.05rem var(--display);letter-spacing:.06em;color:#ffe7a8}
.k-warn{--pc:#ff7a6b;--pg:rgba(255,122,107,.4)}.k-warn::before{content:"\26A0  Warning"}
.k-hero{--pc:#d3a6ff;--pg:rgba(211,166,255,.38)}.k-hero::before{content:"\2605  Hero card"}
.k-reward{--pc:#ffb35c;--pg:rgba(255,179,92,.4)}.k-reward::before{content:"\2756  Reward"}
.k-quest{--pc:#5fe0e8;--pg:rgba(95,224,232,.36)}.k-quest::before{content:"\2691  Quest"}
.k-growth{--pc:#79e2a0;--pg:rgba(121,226,160,.36)}.k-growth::before{content:"\25B2  Growth"}
.k-land{--pc:#d6e07a;--pg:rgba(214,224,122,.34)}.k-land::before{content:"\2302  Territory"}
.gr,.st,.ti{font-weight:800;color:var(--c);text-shadow:0 0 8px color-mix(in srgb,var(--c) 55%,transparent)}
.gr{display:inline-block;min-width:1.7em;text-align:center;padding:0 6px;border-radius:3px;border:1px solid currentColor;font-size:.84em;line-height:1.4;background:color-mix(in srgb,var(--c) 14%,transparent)}
.g0{--c:#b4b4b4}.g1{--c:#a6dc8f}.g2{--c:#62e0a0}.g3{--c:#6fb1ff}.g4{--c:#cf95ff}.g5{--c:#ffa449}.g6{--c:#ff5e57}.g7{--c:#ffd24a}
.g7.gr,.g7.st,.g7.ti{background:linear-gradient(90deg,#f7c948,#fff1b0,#f0b429);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 6px rgba(255,210,74,.55))}
.g7.gr{border-color:#f7c948}
.el{font-weight:800;color:var(--e);text-shadow:0 0 8px color-mix(in srgb,var(--e) 60%,transparent)}
.el-metal{background:linear-gradient(90deg,#9aa4ae,#f4f7fa,#a9b3bd);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 5px rgba(220,228,236,.55))}
.el-wood{--e:#5fd36a}.el-water{--e:#4fb8ff}.el-fire{--e:#ff6a3d}.el-earth{--e:#d9a052}
.el-light{--e:#fff1a8;text-shadow:0 0 10px rgba(255,236,150,.9)}
.el-dark{--e:#a77bff;text-shadow:0 0 8px rgba(80,30,160,.9),0 0 2px #000}
.t1{--c:#b4b4b4}.t2{--c:#62e0a0}.t3{--c:#6fb1ff}.t4{--c:#cf95ff}.t5{--c:#ffa449}.t6{--c:#ff5e57}
.chat{font-family:var(--ui);font-size:.86rem;line-height:1.5;margin:1.2em 0;padding:10px 14px;border-radius:6px;background:var(--chat);border:1px dashed var(--line)}
figure.ill{margin:1.6em 0;display:flex;flex-direction:column;gap:6px}
figure.ill img{width:100%;border-radius:6px;display:block}
figure.ill figcaption{font-size:.8rem;color:var(--muted);text-align:center}
.pager{display:flex;gap:10px;flex-wrap:wrap}
.pager a{flex:1 1 200px;display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);background:var(--surface);min-width:0}
.pager a.nx{text-align:right}
.pager small{color:var(--muted);font:700 .7rem var(--ui);letter-spacing:.12em;text-transform:uppercase}
.progress{position:fixed;left:0;right:0;top:0;height:3px;z-index:11;pointer-events:none}
.progress i{display:block;height:100%;width:0;background:var(--accent)}
#upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:12px;align-items:center;padding:10px 12px 10px 16px;border-radius:10px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.3);font-weight:600;width:max-content;max-width:calc(100% - 32px)}
#upd .btn{padding:8px 14px}
.foot{font-size:.78rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="progress" aria-hidden="true"><i id="prog"></i></div>
<header class="bar" id="bar" hidden><div class="bar-in">
 <a class="title" id="btitle" href="#shelf">Library</a>
 <span id="tools"></span>
 <button class="chip" id="fsm" aria-label="Smaller text">A−</button>
 <button class="chip" id="fsp" aria-label="Larger text">A+</button>
 <button class="chip" id="thm" aria-label="Switch light or dark">Theme</button>
</div></header>
<main><div class="col" id="view"></div></main>
<script>
const CFG = {"books": [{"id": "neo", "title": "New Earth Online: Wrong Server Lord", "short": "Wrong Server Lord", "blurb": "A lightning strike reroutes Rizal Hamdan to the wrong server: China, 184 AD, an empty shore, and a system nobody else has.", "accent": "#33508f", "cover": "img/neo-cover.webp?v=9621f361", "data": "data/neo.bin?v=c1825f96"}, {"id": "sah", "title": "The Spear and the Halberd", "short": "The Spear and the Halberd", "blurb": "On the first morning of the world, Bai Lang plants a Gold token on a riverbank in Yingchuan and opens his free draw.", "accent": "#8a3b2f", "cover": "img/sah-cover.webp?v=6c1bed15", "data": "data/sah.bin?v=959de183"}, {"id": "bmt", "title": "New Earth Online: The Legend of the Blackmoon Troop", "short": "The Blackmoon Troop", "blurb": "Spring 220 AD. The King of Yue's eldest son rides west with five hundred riders and a spear seven hundred years old, into the middle of the Three Kingdoms war.", "accent": "#6e1f2e", "cover": "img/bmt-cover.webp?v=ed1d26ea", "data": "data/bmt.bin?v=1e2336fa"}, {"id": "ecl", "title": "Eclipse: Chaos Root", "short": "Eclipse: Chaos Root", "blurb": "On the last morning of the war, Ye Shuo pulls a black spear from a drowned shrine and falls up a ladder to the second floor of the world, where he is sixteen again, rootless, and the only one who can see.", "accent": "#2b2440", "cover": "img/ecl-cover.webp?v=594e099d", "data": "data/ecl.bin?v=dd0b4fa3"}], "iter": 310000, "built": "2026-11-24 17:17 UTC"};
const $ = s => document.querySelector(s);
const view = $('#view');
const store = {
 get(k, d){ try{ const v = localStorage.getItem('lib_'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
 set(k, v){ try{ localStorage.setItem('lib_'+k, JSON.stringify(v)); }catch(e){} },
 del(k){ try{ localStorage.removeItem('lib_'+k); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n.toLocaleString('en-US');
let fs = store.get('fs', 1.08), theme = store.get('theme', null);
if (theme) document.documentElement.setAttribute('data-theme', theme);
document.documentElement.style.setProperty('--fs', fs+'rem');
const BOOKS = {}; // id -> {meta, chapters}

async function decrypt(buf, pw){
 const b = new Uint8Array(buf), salt = b.slice(0,16), iv = b.slice(16,28), ct = b.slice(28);
 const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
 const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations: CFG.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
 const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
 return JSON.parse(new TextDecoder().decode(pt));
}
async function unlock(pw){
 const res = await Promise.all(CFG.books.map(async m => {
  const r = await fetch(m.data, {cache:'no-cache'}); if (!r.ok) throw new Error('net');
  return [m, await decrypt(await r.arrayBuffer(), pw)];
 }));
 for (const [m, d] of res) BOOKS[m.id] = {meta: m, ch: d.chapters};
 await loadIlls();
}
let ILLS = [];
async function loadIlls(){
 try { const r = await fetch('illustrations/illustrations.json?t=' + Date.now(), {cache:'no-store'}); if (r.ok){ const j = await r.json(); ILLS = Array.isArray(j) ? j : (j.images || []); } } catch(e){ ILLS = []; }
}
const okSrc = s => typeof s === 'string' && /^illustrations\/[A-Za-z0-9_\-\/.]+\.(webp|png|jpe?g|gif)$/i.test(s) && !s.includes('..');
const norm = s => String(s||'').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim().toLowerCase();
function placeIlls(id, cid, box){
 const pid = String(cid), num = parseInt(pid.replace(/\D/g,''), 10);
 ILLS.filter(x => x && x.book === id && (String(x.chapter) === pid || (/^\d+$/.test(String(x.chapter)) && +x.chapter === num && !isNaN(num)) || (String(x.chapter).toLowerCase()==='prologue' && /prologue/.test(pid))) && okSrc(x.image))
  .forEach(x => {
   const fig = document.createElement('figure'); fig.className = 'ill';
   const im = document.createElement('img'); im.src = x.image + '?v=' + encodeURIComponent(CFG.built || ''); im.alt = x.caption || ''; im.loading = 'lazy'; fig.appendChild(im);
   if (x.caption){ const c = document.createElement('figcaption'); c.textContent = x.caption; fig.appendChild(c); }
   const want = norm(x.after); let at = null;
   if (want) at = [...box.querySelectorAll(':scope > p, :scope > .panel, :scope > .chat')].find(p => norm(p.textContent).includes(want));
   if (at) at.after(fig); else box.appendChild(fig);
  });
}
function lockScreen(msg){
 $('#bar').hidden = true;
 view.innerHTML = `<div class="lock"><form id="lf">
  <span class="eyebrow">dizzypapaya</span><h1>Library</h1>
  <p class="muted">Two novels, kept private. Enter your password to open them.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required>
  <label><input type="checkbox" id="keep" checked> Remember on this device</label>
  <button class="btn" type="submit">Open the library</button><div class="err" id="err">${esc(msg||'')}</div></form></div>`;
 $('#lf').onsubmit = async e => {
  e.preventDefault(); const pw = $('#pw').value; $('#err').textContent = 'Opening…';
  try { await unlock(pw); if ($('#keep').checked) store.set('pw', pw); route(); }
  catch(err){ $('#err').textContent = err.message==='net' ? 'Could not download the books. Check your connection and try again.' : 'That password did not work. Check it and try again.'; }
 };
}

const cnum = id => parseInt(String(id).replace(/\D/g,''),10);
const hasPic = (b,id) => ILLS.some(x => x && x.book===b && String(x.chapter)===String(id));
const lab = c => /prologue/.test(c.id) ? 'Prologue' : 'Chapter '+cnum(c.id);
const shortT = t => t.replace(/^(Prologue|Chapter \d+):\s*/, '');
const st = id => store.get('b_'+id, {last:null, read:[], seen:0});
function setBar(title, href, accent){
 $('#bar').hidden = false; const t = $('#btitle'); t.textContent = title; t.href = href;
 document.documentElement.style.setProperty('--accent', accent || '#33508f');
}

function shelf(){
 setBar('Library', '#shelf', '#33508f'); $('#tools').innerHTML = '';
 view.innerHTML = `<span class="eyebrow">Your library</span>` + CFG.books.map(m => {
  const B = BOOKS[m.id], s = st(m.id), n = B.ch.length, fresh = Math.max(0, n - (s.seen||0));
  const cont = s.last ? `<a class="btn" style="background:${m.accent}" href="#${m.id}-${s.last}">Continue · ${esc(lab(B.ch.find(c=>c.id===s.last)||B.ch[0]))}</a>` : `<a class="btn" style="background:${m.accent}" href="#${m.id}-${B.ch[0].id}">Start reading</a>`;
  return `<article class="book">${m.cover ? `<img class="cover" src="${m.cover}" alt="" onerror="if(!this.dataset.r){this.dataset.r=1;this.src=this.src.split('?')[0]+'?r='+Date.now()}">` : `<div class="cover blank" style="--b:${m.accent}">${esc(m.title)}</div>`}
  <div class="txt"><h2>${esc(m.title)}</h2><p class="muted">${esc(m.blurb)}</p>
  <p class="muted" style="font-size:.85rem">${B.ch.some(c=>/prologue/.test(c.id)) ? (n-1)+' chapters + prologue' : n+' chapters'} · ${s.read.length} read${s.seen && fresh ? ` · <b style="color:${m.accent}">${fresh} new</b>` : ''}</p>
  <div class="acts">${cont}<a class="btn ghost" href="#${m.id}">Chapters</a></div></div></article>`; }).join('') +
  `<p class="foot">Updated ${esc(CFG.built)} · <a href="#" id="lockme">Lock this device</a></p>`;
 $('#lockme').onclick = e => { e.preventDefault(); store.del('pw'); location.hash=''; location.reload(); };
}
function contents(id){
 const B = BOOKS[id]; if (!B) return shelf();
 const s = st(id), read = new Set(s.read), seen = s.seen||0;
 setBar(B.meta.short, '#'+id, B.meta.accent); $('#tools').innerHTML = `<a class="chip" href="#shelf">Library</a>`;
 const draw = q => { q=(q||'').toLowerCase().trim();
  $('#tl').innerHTML = B.ch.map((c,k) => ({c,k})).filter(({c}) => !q || c.t.toLowerCase().includes(q) || String(cnum(c.id))===q)
   .map(({c,k}) => `<li><a href="#${id}-${c.id}" class="${read.has(c.id)?'read':''} ${c.id===s.last?'here':''}"><span class="n">${/prologue/.test(c.id)?'·':cnum(c.id)}</span><span class="t">${esc(shortT(c.t))}${hasPic(id,c.id)?' <span title="Has a picture" aria-label="Has a picture">🖼</span>':''}${seen && k>=seen?'<span class="new">NEW</span>':''}</span><span class="r">${fmt(c.w)}</span></a></li>`).join(''); };
 view.innerHTML = `<h1>${esc(B.meta.title)}</h1><input class="search" id="q" type="search" placeholder="Find a chapter by title or number" aria-label="Find a chapter"><ul class="toc" id="tl"></ul>`;
 draw(''); $('#q').oninput = e => draw(e.target.value);
 if (s.last){ const h = view.querySelector('a.here'); if (h) h.scrollIntoView({block:'center'}); }
 s.seen = B.ch.length; store.set('b_'+id, s);
}
function reader(id, cid){
 const B = BOOKS[id]; if (!B) return shelf();
 const k = B.ch.findIndex(c => c.id===cid); if (k<0) return contents(id);
 const c = B.ch[k], prev = B.ch[k-1], next = B.ch[k+1];
 setBar(B.meta.short, '#'+id, B.meta.accent); $('#tools').innerHTML = `<a class="chip" href="#${id}">☰</a>`;
 view.innerHTML = `<article class="chap col" style="gap:10px"><span class="cn">${esc(lab(c))} · ${fmt(c.w)} words</span><h2>${esc(shortT(c.t))}</h2><div class="text" id="txt">${c.h}</div></article>
 <nav class="pager">${prev?`<a href="#${id}-${prev.id}"><small>Previous</small>${esc(prev.t)}</a>`:''}${next?`<a class="nx" href="#${id}-${next.id}"><small>Next</small>${esc(next.t)}</a>`:`<a class="nx" href="#${id}"><small>You are up to date</small>Back to chapters</a>`}</nav>`;
 placeIlls(id, cid, $('#txt'));
 const s = st(id); s.last = cid; store.set('b_'+id, s);
 const pos = store.get('pos_'+id, {}); window.scrollTo(0, pos[cid] > 0 ? pos[cid] : 0);
}

function route(){
 if (!Object.keys(BOOKS).length) return lockScreen();
 const h = location.hash.slice(1); let m;
 if ((m = h.match(/^([a-z]+)-(.+)$/)) && BOOKS[m[1]]) return reader(m[1], m[2]);
 if (BOOKS[h]) return contents(h);
 shelf();
}
let tick = 0;
addEventListener('scroll', () => {
 const m = location.hash.match(/^#([a-z]+)-(.+)$/), max = document.documentElement.scrollHeight - innerHeight;
 $('#prog').style.width = m && max>0 ? Math.min(100, scrollY/max*100)+'%' : '0';
 if (!m || !BOOKS[m[1]]) return;
 if (Date.now()-tick > 700){ tick = Date.now(); const pos = store.get('pos_'+m[1], {}); pos[m[2]] = scrollY; store.set('pos_'+m[1], pos); }
 if (max>0 && scrollY/max > 0.9){ const s = st(m[1]); if (!s.read.includes(m[2])){ s.read.push(m[2]); store.set('b_'+m[1], s); } }
}, {passive:true});
addEventListener('hashchange', () => { route(); if (!/^#[a-z]+-/.test(location.hash)) scrollTo(0,0); });
addEventListener('keydown', e => {
 const m = location.hash.match(/^#([a-z]+)-(.+)$/); if (!m || e.target.tagName==='INPUT' || !BOOKS[m[1]]) return;
 const ch = BOOKS[m[1]].ch, k = ch.findIndex(c=>c.id===m[2]);
 if (e.key==='ArrowRight' && ch[k+1]) location.hash = m[1]+'-'+ch[k+1].id;
 if (e.key==='ArrowLeft' && ch[k-1]) location.hash = m[1]+'-'+ch[k-1].id;
});
$('#fsm').onclick = () => setFs(-0.06); $('#fsp').onclick = () => setFs(0.06);
function setFs(d){ fs = Math.min(1.5, Math.max(0.86, +(fs+d).toFixed(2))); document.documentElement.style.setProperty('--fs', fs+'rem'); store.set('fs', fs); }
$('#thm').onclick = () => { const dark = matchMedia('(prefers-color-scheme: dark)').matches; const cur = document.documentElement.getAttribute('data-theme') || (dark?'dark':'light'); theme = cur==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme', theme); store.set('theme', theme); };
// New chapters pushed while the app was open or cached: check and offer a refresh.
async function checkUpdate(){
 try { const r = await fetch('version.json?t=' + Date.now(), {cache:'no-store'}); if (!r.ok) return; const v = await r.json();
  if (v.built && v.built !== CFG.built && !document.getElementById('upd')){
   const d = document.createElement('div'); d.id = 'upd';
   d.innerHTML = '<span>New chapters are ready.</span><button class="btn" type="button">Refresh</button>';
   d.querySelector('button').onclick = () => location.reload();
   document.body.appendChild(d);
  } } catch(e){}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
setInterval(checkUpdate, 15*60*1000); setTimeout(checkUpdate, 4000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
(async () => {
 const pw = store.get('pw', null);
 if (pw){ view.innerHTML = '<p class="muted">Opening your library…</p>'; try { await unlock(pw); } catch(e){ return lockScreen(e.message==='net' ? 'Could not download the books. Check your connection.' : 'Your saved password no longer works. Enter the new one.'); } }
 route();
})();
</script>
</body>
</html>
